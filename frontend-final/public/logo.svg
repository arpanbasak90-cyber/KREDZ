<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="kredz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    
    <!-- Accent Glow -->
    <linearGradient id="kredz-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Dark Shield Base Gradient -->
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#shield-bg)" filter="url(#drop-shadow)"/>
  
  <!-- Subtle Border Ring -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#kredz-grad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Geometric Shield & K Symbol Fusion -->
  <g transform="translate(256, 256)">
    <!-- Outer Shield Contour -->
    <path d="M 0 -140 L 110 -80 V 30 C 110 100 0 150 0 150 C 0 150 -110 100 -110 30 V -80 Z" 
          fill="none" stroke="url(#kredz-glow)" stroke-width="12" stroke-linejoin="round" opacity="0.3"/>

    <!-- Dynamic "K" Seal Icon -->
    <!-- Left Vertical Bar of K (Shield Backbone) -->
    <path d="M -60 -90 V 90" stroke="url(#kredz-grad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Top Diagonal Wing of K -->
    <path d="M -45 -10 L 55 -90" stroke="url(#kredz-grad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Bottom Verification Check Wing of K -->
    <path d="M -35 15 L 15 65 L 75 -25" fill="none" stroke="url(#kredz-glow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Security/Node Glowing Dots -->
    <circle cx="55" cy="-90" r="10" fill="#60A5FA"/>
    <circle cx="75" cy="-25" r="10" fill="#34D399"/>
    <circle cx="-60" cy="-90" r="10" fill="#3B82F6"/>
    <circle cx="-60" cy="90" r="10" fill="#0D9488"/>
  </g>
</svg>
